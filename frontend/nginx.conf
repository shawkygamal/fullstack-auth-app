server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The API is served from the same origin, so the SameSite=Strict refresh cookie works and no CORS is involved.
    # Its security headers come from helmet in the API.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx's own id for the request; the API logs and returns it, so both sides share one id.
        proxy_set_header X-Request-Id $request_id;
    }

    # Security headers are repeated per location: an add_header in a location drops every inherited one.

    # Hashed build assets never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        expires 1y;
    }

    # Client-side routes (/signin, /signup) fall back to the app shell, which is always revalidated.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri /index.html;
    }
}
